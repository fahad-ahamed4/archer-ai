# =====================================================
# Archer AI - Auto Build & Release
# =====================================================
# This workflow automatically builds Archer AI for:
#   - Windows (.exe) — via Electron
#   - Android (.apk) — via Capacitor + Gradle
#   - Web (Next.js) — optional static build
#
# Triggers:
#   - Push a tag like v4.0.0 → creates a release with all artifacts
#   - Manual dispatch via GitHub Actions UI
# =====================================================

name: Build & Release

on:
  push:
    tags:
      - 'v*'           # Trigger on version tags (v4.0.0, v4.1.0-beta, etc.)
  workflow_dispatch:    # Manual trigger from Actions UI
    inputs:
      version:
        description: 'Version number (e.g., 4.0.0)'
        required: true
        default: '4.0.0'

permissions:
  contents: write      # Required to create releases
  packages: write

jobs:
  # =====================================================
  # Job 1: Build Next.js Web App
  # =====================================================
  build-web:
    name: Build Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: client
        run: bun install --frozen-lockfile || bun install

      - name: Build Next.js
        working-directory: client
        env:
          NODE_ENV: production
        run: bun run build

      - name: Upload web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: archer-ai-web
          path: client/.next/standalone
          retention-days: 30

  # =====================================================
  # Job 2: Build Windows .exe (Electron)
  # =====================================================
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    needs: build-web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: electron
        run: bun install

      - name: Build Electron app for Windows
        working-directory: electron
        run: bun run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          # Update this URL to your deployed Archer AI URL
          APP_URL: https://archer-ai.vercel.app

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: archer-ai-windows
          path: electron/dist/*.exe
          retention-days: 90

      - name: Upload Windows artifact to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: electron/dist/*.exe
          tag_name: ${{ github.ref_name || format('v{0}', inputs.version) }}
          name: Archer AI ${{ github.ref_name || format('v{0}', inputs.version) }}
          body: |
            # 🤖 Archer AI ${{ github.ref_name || format('v{0}', inputs.version) }}

            ## 📦 Downloads

            - **Windows**: Download `archer-ai-*-setup.exe` and run the installer
            - **Android**: See APK in the Android release asset below

            ## 📋 Changelog

            - Voice control with continuous listening
            - 30+ app commands (Banglish)
            - Aurora Holographic theme
            - JARVIS + FRIDAY voice personalities
            - Cute animated mascot
            - Settings drawer with browser support detection

            ## 🚀 Installation

            ### Windows
            1. Download `archer-ai-*-setup.exe`
            2. Run the installer
            3. Launch "Archer AI" from Start Menu
            4. Allow microphone access when prompted

            ### Android
            1. Download `archer-ai.apk`
            2. Enable "Install from unknown sources" in Android settings
            3. Tap the APK file to install
            4. Open "Archer AI" and allow microphone access
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =====================================================
  # Job 3: Build Android .apk (Capacitor)
  # =====================================================
  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: android
        run: bun install

      - name: Add Android platform
        working-directory: android
        run: npx cap add android || true

      - name: Sync web assets
        working-directory: android
        run: bun run sync
        env:
          APP_URL: https://archer-ai.vercel.app

      - name: Build debug APK
        working-directory: android/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Copy APK to release
        working-directory: android
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk archer-ai.apk
          ls -la archer-ai.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: archer-ai-android
          path: android/archer-ai.apk
          retention-days: 90

      - name: Upload APK to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: android/archer-ai.apk
          tag_name: ${{ github.ref_name || format('v{0}', inputs.version) }}
          name: Archer AI ${{ github.ref_name || format('v{0}', inputs.version) }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =====================================================
  # Job 4: Summary
  # =====================================================
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-web, build-windows, build-android]
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## 🎉 Archer AI Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Web (Next.js) | ${{ needs.build-web.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows (.exe) | ${{ needs.build-windows.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android (.apk) | ${{ needs.build-android.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Download artifacts from the workflow run page" >> $GITHUB_STEP_SUMMARY
          echo "- Release artifacts will be available at: https://github.com/${{ github.repository }}/releases" >> $GITHUB_STEP_SUMMARY
